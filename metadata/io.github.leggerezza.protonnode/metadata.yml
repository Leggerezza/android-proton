# Build note: go.mod requires Go >= 1.26 (tool directive + dependencies), while the
# standard F-Droid image ships an older Go. Before submitting, either confirm a
# newer base image is available or downgrade the module to the image's Go.
Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: v0.1.0
    ndk: 28.2.13676358
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends golang-go openjdk-17-jdk-headless
    init: |
      export GOPATH=$HOME/go
      export PATH=$GOPATH/bin:$PATH
    build: |
      export GOPATH=$HOME/go
      export PATH=$GOPATH/bin:$PATH
      export ANDROID_NDK_HOME=$NDK
      go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261117202452-47699113848a
      gomobile init
      scripts/build-core-aar.sh
      ./gradlew --no-daemon assembleRelease
    output: app/build/outputs/apk/release/app-release-unsigned.apk
