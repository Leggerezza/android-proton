name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with: { go-version: '1.27.4' }

      - name: Build the Go core (AAR)
        uses: ./.github/actions/android-core

      - name: Decode keystore (optional)
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No keystore secret: the release APK will be unsigned."
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Checksums + SBOM
        run: |
          sha256sum app/build/outputs/apk/release/*.apk > SHA256SUMS
          bash scripts/sbom.sh > sbom.cdx.json || true

      - name: 16 KB check
        run: bash scripts/check-16kb.sh app/build/outputs/apk/release/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            SHA256SUMS
            sbom.cdx.json
