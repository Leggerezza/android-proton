name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }

      - uses: actions/setup-go@v5
        with: { go-version: '1.27.4' }

      - name: Go vet + tests
        run: cd core && go vet ./... && go test ./... -count=1

      - name: Android unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint (ktlint + Android Lint)
        run: ./gradlew :app:ktlintCheck :app:lintDebug

      - name: Assemble debug + release (release is signed only when a keystore is present)
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - name: 16 KB check
        run: bash scripts/check-16kb.sh app/build/outputs/apk/release/app-release-unsigned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/release/*.apk
